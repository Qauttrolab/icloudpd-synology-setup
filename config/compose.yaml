  #     - ${ICLOUD_PASS_ACCOUNT2}
  #     - --directory
  #     - /data
  #     - --cookie-directory
  #     - /config
  #     - --folder-structure
  #     - "{:%Y/%m}"
  #     - --auto-delete
  #     - --log-level
  #     - info

  # ---------------------------------------------------------------------------
  # ACCOUNT 3 — auskommentiert bis eingerichtet
  # ---------------------------------------------------------------------------
  # icloudpd-account3:
  #   image: icloudpd/icloudpd:latest
  #   container_name: icloudpd-account3
  #   restart: "no"
  #   volumes:
  #     - ./accounts/account3/cookies:/config
  #     - /volume2/Backups/icloud/account3:/data
  #   environment:
  #     - TZ=Europe/Berlin
  #   command:
  #     - icloudpd
  #     - --username
  #     - ${ICLOUD_USER_ACCOUNT3}
  #     - --password
  #     - ${ICLOUD_PASS_ACCOUNT3}
  #     - --directory
  #     - /data
  #     - --cookie-directory
  #     - /config
  #     - --folder-structure
  #     - "{:%Y/%m}"
