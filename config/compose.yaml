# =============================================================================
# VERWENDUNG
# =============================================================================
#
# Einzelnen Account manuell starten (z.B. zum Testen):
#   docker-compose -f compose.yaml run --rm icloudpd-account1
#
# Container erstellen (einmalig, danach via run-all.sh):
#   docker-compose -f compose.yaml up -d icloudpd-account1
#
# Logs:
#   docker logs -f icloudpd-account1
# =============================================================================
